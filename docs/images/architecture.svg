<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">Компоненты Media Knowledge</title>
  <desc id="desc">Клиент и браузер запрашивают метаданные у API. Медиа передаются напрямую через S3. Desktop выполняет локальную обработку. PostgreSQL хранит метаданные на VPS.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#476582"/></marker></defs>
  <rect width="960" height="640" rx="18" fill="#f4f7fb"/>
  <g font-family="Arial, sans-serif" fill="#172b42">
    <text x="40" y="44" font-size="24" font-weight="700">Media Knowledge</text>
    <text x="40" y="72" font-size="16">Медиа идут напрямую в S3. На VPS находятся только метаданные.</text>
    <g fill="#fff" stroke="#9bb2ca" stroke-width="2">
      <rect x="40" y="120" width="260" height="120" rx="12"/>
      <rect x="40" y="420" width="260" height="120" rx="12"/>
      <rect x="385" y="120" width="220" height="120" rx="12"/>
      <rect x="675" y="120" width="240" height="120" rx="12"/>
      <rect x="675" y="420" width="240" height="120" rx="12"/>
      <rect x="385" y="420" width="220" height="120" rx="12"/>
    </g>
    <g font-size="18" font-weight="700">
      <text x="60" y="153">Приложение Flutter</text><text x="60" y="453">Веб-плеер</text>
      <text x="405" y="153">API на VPS</text><text x="695" y="153">PostgreSQL</text>
      <text x="695" y="453">S3-хранилище</text><text x="405" y="453">Desktop-обработка</text>
    </g>
    <g font-size="15">
      <text x="60" y="184">macOS, Windows, Android, iOS</text><text x="60" y="211">SQLite и офлайн-поиск</text>
      <text x="60" y="484">Публичная ссылка</text><text x="60" y="511">Без регистрации</text>
      <text x="405" y="184">Синхронизация и доступ</text><text x="405" y="211">Временные S3-ссылки</text>
      <text x="695" y="184">Каталог и версии</text><text x="695" y="211">Тексты и задания</text>
      <text x="695" y="484">Оригиналы и копии</text><text x="695" y="511">Прямое чтение и запись</text>
      <text x="405" y="484">FFmpeg, Whisper, LLM</text><text x="405" y="511">Локальные модели</text>
    </g>
  </g>
  <g stroke="#476582" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M300 170H385"/><path d="M605 180H675"/>
    <path d="M170 420V300H430V240"/><path d="M495 420V240"/>
    <path d="M300 210H330V335H795V420"/>
    <path d="M170 540V585H795V540"/><path d="M605 480H675"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="14" fill="#274562">
    <text x="185" y="289">Метаданные</text><text x="530" y="325">Медиа напрямую</text>
    <text x="325" y="575">Медиа напрямую</text><text x="509" y="365">Задания</text>
  </g>
</svg>
