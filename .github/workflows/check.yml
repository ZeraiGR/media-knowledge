name: Infrastructure checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - run: bash -n ops/install.sh ops/storage/configure.sh
      - name: Validate Compose
        env:
          POSTGRES_PASSWORD: synthetic
          SERVER_IMAGE: ghcr.io/zeraigr/media-knowledge-server:synthetic
          WEB_IMAGE: ghcr.io/zeraigr/media-knowledge-web:synthetic
        run: docker compose -f ops/compose.yaml config --quiet
