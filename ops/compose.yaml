name: media-knowledge
services:
  db:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: media
      POSTGRES_DB: media
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U media -d media"]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 256m
    pids_limit: 100
    security_opt: ["no-new-privileges:true"]
  api:
    image: ${SERVER_IMAGE:?Set SERVER_IMAGE}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://media:${POSTGRES_PASSWORD}@db:5432/media?sslmode=disable
    ports: ["127.0.0.1:18501:8080"]
    depends_on:
      db: {condition: service_healthy}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 50
  web:
    image: ${WEB_IMAGE:?Set WEB_IMAGE}
    restart: unless-stopped
    ports: ["127.0.0.1:18500:8080"]
    read_only: true
    tmpfs: ["/data:uid=1000,gid=1000", "/config:uid=1000,gid=1000"]
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    pids_limit: 50
volumes:
  postgres:
